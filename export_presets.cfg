; Export presets for Heroes of Teloria.
;
; Committed on purpose: a build anyone can download should be reproducible from
; the repository rather than from whatever was set up on one machine. The
; release workflow in .github/workflows/release.yml exports these three.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="docs/*, build/*, tools/*.py, tools/*.sh"
export_path="build/windows/HeroesOfTeloria.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="Heroes of Teloria"
application/product_name="Heroes of Teloria"
application/file_description="Heroes of Teloria prototype"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="docs/*, build/*, tools/*.py, tools/*.sh"
export_path="build/linux/HeroesOfTeloria.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

[preset.2]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="docs/*, build/*, tools/*.py, tools/*.sh"
export_path="build/macos/HeroesOfTeloria.zip"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

export/distribution_type=0
texture_format/etc2_astc=true
; The official macOS template ships one universal binary, so universal is the
; only architecture that can be exported from it.
binary_format/architecture="universal"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
application/icon=""
application/icon_interpolation=4
application/bundle_identifier="com.bluespindash.heroesofteloria"
application/signature=""
application/app_category="Games"
application/short_version=""
application/version=""
application/copyright=""
application/min_macos_version="10.12"
application/export_angle=0
display/high_res=true
codesign/codesign=0
notarization/notarization=0
privacy/microphone_usage_description=""
privacy/camera_usage_description=""
ssh_remote_deploy/enabled=false
